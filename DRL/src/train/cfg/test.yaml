defaults:
  - _self_
  - env
  - uav

# 训练设备
device: "cuda:0"

# launch文件地址
launchFile: multi_uav_static_env.launch

# 验证参数
eval:
  numEpisodes: 1
  # checkPointPath: "/home/ldt/PythonProjects/self_avoid/Drone-self-avoidance/self_avoidance_gym/pth"
  checkPointPath: "/home/ldt/checkPoints"
  # navigationModel: "DDPG"
  navigationModel: "MTrans-SAC"
  # navigationModel: "ego-planner"


land: False  # 是否降落
retrain: True  # 是否重新训练
epochs: 1e5  # 训练轮数
seed: 0  # 随机种子
actorLearningRate: 1e-4  # 策略网络学习率
criticLearningRate: 1e-4  # 动作价值网络学习率
alpha: 0.01  # alpha值
alphaLearningRate: 1e-4  # alpha的学习率
targetEntity: 0.01  # 目标熵
gamma: 0.99  # 奖励折扣因子
tau: 0.005  # soft update参数
numEpisodes: 5000  # 训练轮次
bufferSize: 5000  # 经验回放池容量
minimalSize: 128  # 最小容量
batchSize: 128  # 批次大小
actorLearningRateDecayStep: 500  # actor学习率衰减步长
actorLearningRateDecayGamma: 0.1  # actor学习率衰减系数
criticLearningRateDecayStep: 500  # critic学习率衰减步长
criticLearningRateDecayGamma: 0.1  # critic学习率衰减系数
normalizeDepth: True  # 是否归一化深度信息

# gazebo参数
gazebo:
  gui: True  # 是否启用gui
  turbo:
    enabled: True  # 加速开关
    timeStep: None  # 时间步长，None则保持原状

# wandb参数
wandb:
  enabled: True  # 是否启用wandb
  project: XTDrone-DRL  # wandb项目名
  name: navigation-training  # wandb实验名
  entity: ldt20020517-beihang-university  # wandb实体名
  mode: online   # wandb模式
  id: kw9xf9k8  # wandb实验ID
  dir: ../wandb  # wandb保存目录
  resumeFlag: True  # 是否恢复实验
  checkPointDir: ../checkPoints  # 模型保存目录
  checkPointPath: ../checkPoints/kw9xf9k8.pt  # 模型保存路径
  saveEvery: 1  # 每训练n轮保存一次模型

# 用于MTrans-SAC算法的测试配置
actionBound: 2.0  # 动作限制
loadModel: "SAC_only_mean_good.pt"