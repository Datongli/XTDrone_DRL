env:
  # 环境参数
  length: 100
  width: 100
  height: 25

  staticObstaclesNum: 30  # 静态障碍物数量
  obstacleHorizontalRange: 1  # 障碍物水平半径
  obstacleVerticalRange: 20  # 障碍物垂直高度

  targetRadius: 0.5  # 目标点半径

  # 无人机动作限制
  actionBounds: [[-1, 1], [-1, 1], [-1, 1], [-3.1415926535, 3.1415926535]]
  maxStep: 300  # 最大步长

  # 无人机深度相机缩放参数
  minDepthMeters: 0.01
  maxDepthMeters: 50

  # 无人机2D雷达缩放参数
  minLidarMeters: 0.5
  maxLidarMeters: 20
