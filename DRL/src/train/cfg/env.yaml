env:
  # 环境参数
  length: 100
  width: 100
  height: 25
  level: 15  # 环境的难度

  # staticObstaclesNum: 20  # 静态障碍物数量
  obstacleHorizontalRange: 10  # 障碍物水平半径
  obstacleVerticalRange: 20  # 障碍物垂直高度
  # 建筑材料名称
  buildingMaterialNames : [
        "XtDroneDrl/BuildingConcrete",
        "XtDroneDrl/BuildingBrick",
        "XtDroneDrl/BuildingSolidBlue",
    ]

  pausePhysicsBetweenSteps: False  # 是否在每个step之间暂停gazebo物理仿真
  controlHz: 50  # 控制频率
  stepDuration: 1.0  # 每个step的持续时间

  targetRadius: 2.0  # 目标点半径

  # 无人机动作限制
  # actionBounds: [[-1, 1], [-1, 1], [-1, 1], [-3.1415926535, 3.1415926535]]
  actionBounds: [[-2, 2], [-2, 2], [-2, 2], [-0.5, 0.5]]  # [vx(m/s), vy, vz, yawRate(rad/s)]
  maxStep: 300  # 最大步长

  # 无人机深度相机缩放参数
  minDepthMeters: 0.01
  maxDepthMeters: 50

  # 无人机2D雷达缩放参数
  minLidarMeters: 0.1
  maxLidarMeters: 100

  # 二维码地标边长
  apriltagSize: 1  # 单位：米

  # 奖励参数
  reward:
    wTarget: 0.5  # 靠近目标奖励系数
    safeDistance: 5.0  # 安全距离
    boundarySafeDistance: 4.0  # 边界安全距离
    wBound: 0.1  # 边界惩罚权重
    dangerThreshold: 3.0  # 危险阈值
    safeMargin: 3.0  # 高度保护安全 
    wMin: 0.5  # 最小距离项权重
    wDanger: 0.3  # 危险束比例项权重
    wField: 0.2  # 距离势场项权重
    wAngle: 0.5  # 角度引导奖励系数
    wAltitude: 0.5  # 高度保护奖励系数
    wStep: 0.05  # 步数项权重
    alpha: 2.0  # 势场塑形的指数
    wEnergy: 0.01  # 能量消耗项权重
    collisionPenalty: 50.0  # 碰撞惩罚
    goalReward: 100.0  # 目标奖励
    energyOutPenalty: 5.0  # 能量耗尽惩罚
    stepOutPenalty: 5.0  # 超过步长惩罚
    landReward: 100.0  # 降落成功奖励
