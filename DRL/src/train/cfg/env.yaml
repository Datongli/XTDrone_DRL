env:
  # 环境参数
  length: 100
  width: 100
  height: 25

  staticObstaclesNum: 20  # 静态障碍物数量
  obstacleHorizontalRange: 4  # 障碍物水平半径
  obstacleVerticalRange: 20  # 障碍物垂直高度

  targetRadius: 1  # 目标点半径

  # 无人机动作限制
  # actionBounds: [[-1, 1], [-1, 1], [-1, 1], [-3.1415926535, 3.1415926535]]
  actionBounds: [[-2, 2], [-2, 2], [-2, 2], [-0.5, 0.5]]  # [vx(m/s), vy, vz, yawRate(rad/s)]
  maxStep: 300  # 最大步长

  # 无人机深度相机缩放参数
  minDepthMeters: 0.01
  maxDepthMeters: 50

  # 无人机2D雷达缩放参数
  minLidarMeters: 0.1
  maxLidarMeters: 100

  # 二维码地标边长
  apriltagSize: 1  # 单位：米
