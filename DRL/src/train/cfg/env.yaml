env:
  # 环境参数
  length: 50
  width: 50
  height: 20

  staticObstaclesNum: 30  # 静态障碍物数量
  obstacleHorizontalRange: 1  # 障碍物水平半径
  obstacleVerticalRange: 20  # 障碍物垂直高度

  targetRadius: 0.2  # 目标点半径

  # 无人机动作限制
  actionBounds: [[-1, 1], [-1, 1], [-1, 1], [-3.1415926535, 3.1415926535]]
  maxStep: 300  # 最大步长

  # 无人机深度相机缩放参数
  minDepthMeters: 0.01
  maxDepthMeters: 50
