uav:
  # uav相关设置
  uavNums: 1
  # 传感器类型设置
  # sensorType: "iris_realsense_camera"
  sensorType: "iris_2d_lidar"
  # sensorType: "iris_2d_lidar_and_downward_camera"
  # 是否启用Gazebo仿真传感器
  enableSimSensor: False
  # 无人机初始化位置，训练时x，y会随机生成
  # 测试时一般只测试一个位置，程序按照下列的输入初始化无人机位置
  initPosition:
    x: 80
    y: 5
    z: 0.5
  # 无人机悬停位置
  hoverPosition:
    x: 0
    y: 0
    z: 5

  # MTrans-SAC算法相关设置
  stateDim: 7
  sensor:
    numBeams: 512  # 激光雷达波束数量
    minRange: 0.5  # 激光雷达最小检测距离
    maxRange: 100.0  # 激光雷达最大检测距离